# 배포용 Compose (EC2 단일 호스트)
# 사용법: docs/operations/deployment.md 참고
#   docker compose -f docker-compose.prod.yml --profile runtime-images build python-runner
#   docker compose -f docker-compose.prod.yml up -d --build

name: neconaeco

services:
  web:
    build:
      context: ${FRONTEND_DIR:-../neco-frontend}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /v1
        VITE_SOCKET_URL: wss://${DOMAIN:?DOMAIN 값을 .env에 설정하세요}/ws
    ports:
      - '80:80'
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SYNCHRONIZE: 'false'
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - '8080'
    volumes:
      # 미션 실행용 python-runner 컨테이너를 형제 컨테이너로 띄우기 위해 필요
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # 배포할 때마다 DB 마이그레이션을 한 번 실행하고 종료
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    command: ['pnpm', 'migration:run']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # 백엔드가 미션마다 띄우는 실행 이미지 (상시 실행 X, 빌드만)
  python-runner:
    image: neconaeco/python-runner:python-3.12-v1
    build:
      context: ./docker/runtime/python-runner
    profiles:
      - runtime-images
    restart: 'no'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 값을 .env에 설정하세요}
      POSTGRES_DB: ${DB_NAME:-neconaeco}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --loglevel warning
        else
          exec redis-server --save "" --loglevel warning
        fi
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test:
        - 'CMD-SHELL'
        - |
          if [ -n "$${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
